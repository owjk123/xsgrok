name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
    
    - name: Download Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
        unzip -q gradle.zip
        export PATH=$PWD/gradle-8.5/bin:$PATH
        gradle wrapper --gradle-version 8.5
    
    - name: Build with Gradle
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug --no-daemon || bash gradlew assembleDebug --no-daemon || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list | head -20
    
    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 5
