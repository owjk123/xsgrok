name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
    
    - name: Decode Keystore
      run: |
        mkdir -p keystore
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/xsgrok.jks
        ls -la keystore/
    
    - name: Download Gradle
      run: |
        mkdir -p gradle/wrapper
        curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
        unzip -q gradle.zip
        export PATH=$PWD/gradle-8.5/bin:$PATH
        gradle wrapper --gradle-version 8.5
    
    - name: Build Release APK
      id: build
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x gradlew || true
        ./gradlew assembleRelease --no-daemon --stacktrace
        echo "apk_path=$(find . -name '*.apk' -type f 2>/dev/null | head -1)" >> $GITHUB_OUTPUT
        echo "apk_count=$(find . -name '*.apk' -type f 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT
    
    - name: List APK files
      run: |
        find . -name '*.apk' -type f 2>/dev/null || echo "No APK files found"
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "APK directory not found"
    
    - name: Upload APK
      if: steps.build.outputs.apk_count > 0
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          app/build/outputs/apk/release/*.apk
        retention-days: 5
